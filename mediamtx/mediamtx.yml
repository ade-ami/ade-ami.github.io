###############################################
# Global settings
###############################################
logLevel: info
logDestinations: [stdout]
logStructured: false
logFile: mediamtx.log
sysLogPrefix: mediamtx
dumpPackets: false

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512
udpMaxPayloadSize: 1452
udpReadBufferSize: 0

###############################################
# Server endpoints (WebRTC is enabled for HTML5 playback)
###############################################
rtsp: true
rtspTransports: [udp, multicast, tcp]
rtspAddress: :8554
rtpAddress: :8000
rtcpAddress: :8001

rtmp: true
rtmpAddress: :1935

hls: true
hlsAddress: :8888
hlsVariant: lowLatency

webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

api: true
apiAddress: :9997

###############################################
# Default path settings
###############################################
pathDefaults:
  source: publisher
  sourceOnDemand: false # Change to true to pull from camera ONLY when viewed (saves bandwidth)
  rtspTransport: tcp # Often more reliable for IP cameras over local network

###############################################
# Path settings (Your Cameras)
###############################################

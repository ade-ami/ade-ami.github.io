<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penerimaan Hadiah - Meja Tamu</title>
    <link href="img/logo.png" rel="icon">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config for Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .dark body {
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">

    <!-- Header -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm sticky top-0 z-40 transition-colors duration-300">
        <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 rounded-xl flex items-center justify-center transition-colors duration-300">
                    <i data-lucide="gift" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg tracking-tighter uppercase text-slate-800 dark:text-white leading-tight transition-colors duration-300">Penerimaan Hadiah</h1>
                    <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 tracking-widest uppercase">Wedding Ami & Ade</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all active:scale-95">
                    <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
                </button>
                <div class="hidden sm:flex items-center gap-2 text-[10px] font-black text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/20 px-3 py-1.5 rounded-full border border-emerald-200 dark:border-emerald-800/50 transition-colors duration-300">
                    <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> ONLINE
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-6 flex items-start justify-center pt-8 md:pt-12 pb-24">
        <div class="w-full max-w-xl bg-white dark:bg-slate-800 rounded-[2.5rem] shadow-xl border border-slate-100 dark:border-slate-700 overflow-hidden transition-colors duration-300">
            <div class="p-8 md:p-10 border-b border-slate-100 dark:border-slate-700 bg-indigo-50/30 dark:bg-indigo-900/10 transition-colors duration-300">
                <h2 class="text-2xl font-black text-center text-slate-800 dark:text-white mb-2 transition-colors duration-300">Form Data Hadiah</h2>
                <p class="text-center text-sm text-slate-500 dark:text-slate-400 font-medium transition-colors duration-300">Catat hadiah yang diberikan oleh tamu undangan di bawah ini.</p>
            </div>
            
            <div class="p-8 md:p-10">
                <form id="form-hadiah" class="space-y-6">
                    
                    <!-- Nama Pengirim dengan Dropdown -->
                    <div class="space-y-1 relative">
                        <label class="text-[10px] font-black uppercase text-slate-500 dark:text-slate-400 tracking-widest ml-2 block transition-colors duration-300">Nama Pengirim</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="user" class="w-5 h-5 text-slate-400 dark:text-slate-500 transition-colors duration-300"></i>
                            </div>
                            <input type="text" id="input-sender" onfocus="showGuestDropdown()" oninput="filterGuestDropdown()" required autocomplete="off" placeholder="Ketik atau pilih nama tamu..." class="w-full pl-12 pr-6 py-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none text-sm text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-800 transition-all font-bold">
                        </div>
                        <div id="guest-dropdown" class="hidden absolute w-full z-50 top-full mt-2 max-h-56 overflow-y-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl custom-scrollbar transition-colors duration-300">
                            <!-- List akan di render di sini -->
                        </div>
                    </div>

                    <!-- Jenis Hadiah -->
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-500 dark:text-slate-400 tracking-widest ml-2 block transition-colors duration-300">Jenis Hadiah</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="package" class="w-5 h-5 text-slate-400 dark:text-slate-500 transition-colors duration-300"></i>
                            </div>
                            <select id="input-type" onchange="toggleType()" class="w-full pl-12 pr-6 py-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none text-sm text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-800 transition-all font-bold appearance-none cursor-pointer">
                                <option value="Uang">Uang (Amplop / Transfer)</option>
                                <option value="Barang">Barang Fisik</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                                <i data-lucide="chevron-down" class="w-5 h-5 text-slate-400 dark:text-slate-500 transition-colors duration-300"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Nominal Uang -->
                    <div id="amount-container" class="space-y-1 transition-all duration-300">
                        <label class="text-[10px] font-black uppercase text-slate-500 dark:text-slate-400 tracking-widest ml-2 block transition-colors duration-300">Nominal (Rp)</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <span class="font-black text-slate-400 dark:text-slate-500 transition-colors duration-300">Rp</span>
                            </div>
                            <input type="number" id="input-amount" required placeholder="0" class="w-full pl-12 pr-6 py-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none text-sm text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-800 transition-all font-bold">
                        </div>
                    </div>

                    <!-- Deskripsi / Keterangan -->
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-500 dark:text-slate-400 tracking-widest ml-2 block transition-colors duration-300">Keterangan / Detail Barang</label>
                        <textarea id="input-desc" placeholder="Contoh: Amplop merah, atau Set Panci Merah..." rows="3" class="w-full px-6 py-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none resize-none text-sm text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-800 transition-all font-medium custom-scrollbar"></textarea>
                    </div>

                    <!-- Tombol Submit -->
                    <button type="submit" id="btn-submit" class="w-full bg-indigo-600 text-white py-5 rounded-[1.5rem] font-black text-sm uppercase tracking-widest shadow-xl shadow-indigo-600/30 hover:bg-indigo-700 hover:shadow-indigo-600/40 hover:-translate-y-1 active:translate-y-0 active:scale-95 transition-all flex items-center justify-center gap-3 mt-4 disabled:opacity-70 disabled:cursor-not-allowed">
                        <i data-lucide="save" class="w-5 h-5"></i> <span id="btn-text">Simpan Data Hadiah</span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Modal Success/Error/Warning -->
    <div id="modal-feedback" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 dark:bg-slate-950/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div id="modal-feedback-content" class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl transform scale-90 transition-all duration-300 text-center">
            <div id="modal-icon" class="w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-6 shadow-inner">
                <!-- Icon disuntikkan via JS -->
            </div>
            <h3 id="modal-title" class="text-xl font-black text-slate-800 dark:text-white mb-2 transition-colors duration-300">Berhasil!</h3>
            <p id="modal-message" class="text-sm text-slate-500 dark:text-slate-400 font-medium mb-8 transition-colors duration-300">Data hadiah telah berhasil disimpan ke dalam database.</p>
            <button onclick="closeModal()" class="w-full py-4 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-black rounded-2xl text-xs uppercase tracking-widest transition-colors">Mengerti & Tutup</button>
        </div>
    </div>

    <script>
        // --- LOGIKA TEMA (DARK/LIGHT MODE) ---
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('hadiah-theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('theme-icon');
            if (isDark) {
                icon.setAttribute('data-lucide', 'sun');
            } else {
                icon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('hadiah-theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            }
            updateThemeIcon(savedTheme === 'dark');
        }

        // --- KONFIGURASI SUPABASE ---
        const supabaseUrl = 'https://qczzjtraivdxdergbxjy.supabase.co';
        const supabaseKey = 'sb_publishable_sdf_MeOzRGvsGACogsDBLg_sDMgZOeW';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let invitationList = [];

        // --- FETCH DATA TAMU UNTUK DROPDOWN ---
        async function fetchInvitationList() {
            try {
                const { data, error } = await _supabase.from('invitation_list').select('guest_name').order('guest_name', { ascending: true });
                if (!error && data) {
                    invitationList = data;
                }
            } catch (err) {
                console.error("Gagal mengambil data undangan:", err);
            }
        }

        // --- STREAMING_CHUNK:Menyusun Fitur Autocomplete Pencarian... ---
        // --- LOGIC DROPDOWN PENCARIAN NAMA ---
        function showGuestDropdown() {
            document.getElementById('guest-dropdown').classList.remove('hidden');
            renderGuestDropdown(invitationList);
        }

        function filterGuestDropdown() {
            const query = document.getElementById('input-sender').value.toLowerCase();
            const filtered = invitationList.filter(g => g.guest_name && g.guest_name.toLowerCase().includes(query));
            renderGuestDropdown(filtered);
            document.getElementById('guest-dropdown').classList.remove('hidden');
        }

        function renderGuestDropdown(list) {
            const container = document.getElementById('guest-dropdown');
            if (!list || list.length === 0) {
                container.innerHTML = `<div class="p-5 text-sm text-slate-400 dark:text-slate-500 text-center font-medium">Tidak ada data ditemukan. Ketik nama manual.</div>`;
                return;
            }
            container.innerHTML = list.map(g => `
                <div onclick="selectGuestForGift('${g.guest_name.replace(/'/g, "\\'")}')" class="px-6 py-4 hover:bg-indigo-50 dark:hover:bg-slate-700 cursor-pointer transition-colors border-b border-slate-100 dark:border-slate-700 last:border-0 text-sm font-bold text-slate-700 dark:text-slate-200">
                    ${g.guest_name}
                </div>
            `).join('');
        }

        function selectGuestForGift(name) {
            document.getElementById('input-sender').value = name;
            document.getElementById('guest-dropdown').classList.add('hidden');
        }

        // Sembunyikan dropdown jika klik di luar
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('guest-dropdown');
            const input = document.getElementById('input-sender');
            if (dropdown && !dropdown.contains(e.target) && e.target !== input) {
                dropdown.classList.add('hidden');
            }
        });

        // --- UI TOGGLE FIELD ---
        function toggleType() {
            const type = document.getElementById('input-type').value;
            const amountContainer = document.getElementById('amount-container');
            const amountInput = document.getElementById('input-amount');
            
            if (type === 'Uang') {
                amountContainer.classList.remove('hidden');
                setTimeout(() => amountContainer.classList.remove('opacity-0', '-translate-y-4'), 10);
                amountInput.setAttribute('required', 'true');
            } else {
                amountContainer.classList.add('opacity-0', '-translate-y-4');
                setTimeout(() => amountContainer.classList.add('hidden'), 300);
                amountInput.removeAttribute('required');
                amountInput.value = '';
            }
        }

        // --- STREAMING_CHUNK:Menyimpan Data dengan Cek Duplikasi... ---
        // --- SUBMIT DATA KE SUPABASE ---
        document.getElementById('form-hadiah').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');
            const originalText = btnText.innerText;
            
            const senderName = document.getElementById('input-sender').value.trim();
            
            btn.disabled = true;
            btnText.innerHTML = "Memeriksa & Menyimpan...";
            
            try {
                // 1. CEK DUPLIKASI NAMA DI TABEL GIFTS
                const { data: existingGifts, error: checkError } = await _supabase
                    .from('gifts')
                    .select('sender_name')
                    .ilike('sender_name', senderName) // ilike mengabaikan huruf besar/kecil
                    .limit(1);

                if (checkError) throw checkError;

                // Jika nama sudah ada di tabel gifts
                if (existingGifts && existingGifts.length > 0) {
                    showModal('warning', 'Nama Sudah Ada', `Tamu bernama <b class="text-slate-800 dark:text-white">${senderName}</b> sudah tercatat memberikan hadiah.<br><br>Jika ini tamu yang berbeda, mohon tambahkan keterangan di namanya (Contoh: "<b>${senderName} Kantor</b>").`);
                    
                    // Kembalikan status tombol
                    btn.disabled = false;
                    btnText.innerHTML = originalText;
                    return; // Hentikan proses simpan
                }

                // 2. PROSES SIMPAN JIKA NAMA BELUM ADA
                const payload = {
                    sender_name: senderName,
                    gift_type: document.getElementById('input-type').value,
                    amount: document.getElementById('input-type').value === 'Uang' ? parseFloat(document.getElementById('input-amount').value || 0) : 0,
                    description: document.getElementById('input-desc').value.trim()
                };

                const { error: insertError } = await _supabase.from('gifts').insert([payload]);
                
                if (insertError) throw insertError;
                
                // Jika sukses
                showModal('success', 'Tersimpan!', `Hadiah dari <b class="dark:text-white text-slate-800">${payload.sender_name}</b> berhasil dicatat.`);
                this.reset();
                document.getElementById('input-type').value = 'Uang';
                toggleType();

            } catch (err) {
                console.error(err);
                showModal('error', 'Gagal', 'Terjadi kesalahan saat memeriksa/menyimpan data. Cek koneksi Anda.');
            } finally {
                // Kembalikan tombol jika tidak di-return sebelumnya
                if (btn.disabled && btnText.innerHTML === "Memeriksa & Menyimpan...") {
                    btn.disabled = false;
                    btnText.innerHTML = originalText;
                }
            }
        });

        // --- STREAMING_CHUNK:Menangani Dinamika Tampilan Modal... ---
        // --- MODAL FEEDBACK ---
        function showModal(type, title, message) {
            const modal = document.getElementById('modal-feedback');
            const content = document.getElementById('modal-feedback-content');
            const iconContainer = document.getElementById('modal-icon');
            
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerHTML = message;

            if (type === 'success') {
                iconContainer.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-6 shadow-inner bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400";
                iconContainer.innerHTML = '<i data-lucide="check-circle-2" class="w-10 h-10"></i>';
            } else if (type === 'warning') {
                iconContainer.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-6 shadow-inner bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400";
                iconContainer.innerHTML = '<i data-lucide="alert-triangle" class="w-10 h-10"></i>';
            } else {
                iconContainer.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-6 shadow-inner bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400";
                iconContainer.innerHTML = '<i data-lucide="x-circle" class="w-10 h-10"></i>';
            }

            lucide.createIcons();
            modal.classList.remove('hidden');
            
            // Animasi masuk
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-90');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal-feedback');
            const content = document.getElementById('modal-feedback-content');
            
            // Animasi keluar
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-90');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // --- ONLOAD INIT ---
        window.onload = () => {
            initTheme();
            lucide.createIcons();
            fetchInvitationList();
        }
    </script>
</body>
</html>
